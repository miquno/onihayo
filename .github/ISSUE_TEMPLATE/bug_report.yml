name: Bug report
description: Something in Onihayo does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** See SECURITY.md.
        Please do not include personal data, passwords, or tokens.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and device
      placeholder: Firefox 142 on Windows 11, desktop
  - type: dropdown
    id: assistive
    attributes:
      label: Assistive technology involved?
      options:
        - 'No'
        - Screen reader
        - Keyboard only
        - Zoom / magnification
        - Other
