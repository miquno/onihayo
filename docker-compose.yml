services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: onihayo
      POSTGRES_USER: onihayo_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Copy .env.example to .env and set local database passwords}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD in .env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - onihayo-postgres-data:/var/lib/postgresql
      - ./scripts/db/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onihayo-postgres-data:
